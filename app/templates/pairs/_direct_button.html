{% from "_icons.html" import icon %}
{# Tlačítko přímého přenosu v hlavičce detailu; po změně výběru se překreslí out-of-band. #}
{% if st.transferring %}
    <form method="post" action="/pary/{{ pair.id }}/primy-prenos/zrusit" id="direct-button"{% if oob %} hx-swap-oob="true"{% endif %}>
      <button type="submit" class="btn btn-danger">{{ icon('stop', 18) }}Zrušit přenos</button>
    </form>
    {% elif st.direct_supported and plan %}
    <form method="post" action="/pary/{{ pair.id }}/primy-prenos" id="direct-button"{% if oob %} hx-swap-oob="true"{% endif %}
          data-confirm="{% if direct.uploads %}Nahrát {{ direct.uploads|cz_plural('soubor', 'soubory', 'souborů') }} ({{ direct.upload_bytes|filesize }}) přímo na NAS2{% endif %}{% if direct.uploads and direct.deletions %} a {% endif %}{% if direct.deletions %}smazat na NAS2 {{ direct.deletions|cz_plural('přebývající soubor', 'přebývající soubory', 'přebývajících souborů') }}{% endif %}. Přenos běží na pozadí a jde kdykoli zrušit; rozpracovaný soubor příště naváže."
          data-confirm-title="Spustit přímý přenos?" data-confirm-ok="Spustit přenos">
      <button type="submit" class="btn {{ 'btn-secondary' if direct.count else 'btn-outline' }}" {% if not direct.count or st.busy %}disabled{% endif %}
              title="{% if direct.count %}Nahrát / smazat soubory označené k přímému přenosu{% else %}Nejdřív označ soubory a zvol „Přidat k přímému přenosu“{% endif %}">
        {{ icon('upload', 18) }}Přímý přenos{% if direct.count %} ({{ direct.count|number }}){% endif %}
      </button>
    </form>
    {% else %}
    <span id="direct-button" hidden{% if oob %} hx-swap-oob="true"{% endif %}></span>
    {% endif %}
