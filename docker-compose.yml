services:
  app:
    # Produkce: image z GHCR. Lokální vývoj: zakomentuj image a odkomentuj build.
    image: ghcr.io/elvisek2020/web-sync_orchestrator:latest
    # build:
    #   context: .
    container_name: nas-sync-orchestrator
    hostname: nas-sync-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - TZ=Europe/Prague
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/data/sync_orchestrator.db
      # Kořen NAS1 v kontejneru; cesty lokální strany páru jsou relativní k němu.
      - LOCAL_ROOT=/mnt/nas1
    volumes:
      # Databáze aplikace (na hostiteli vlastník UID 1000: chown -R 1000:1000 ./data)
      - ./data:/data
      # NAS1 — jen pro čtení. Uprav cestu podle svého systému (např. /share na QNAP).
      - /share:/mnt/nas1:ro
      # Volitelně: přenosový disk (Přenos na disk, načtení volného místa) — pro zápis, bez :ro
      # - /volumeUSB1/usbshare:/mnt/disk
    # Pokud uživatel UID 1000 nemá právo číst všechny složky NAS1, sken skončí chybou
    # „Nelze přečíst složku…“. Pak spusť kontejner jako root:
    # user: "0:0"
